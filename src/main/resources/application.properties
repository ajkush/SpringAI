spring.application.name=weather

# Server Configuration
server.port=8080

# OpenWeatherMap API Configuration
weather.api.key=${OPENWEATHER_API_KEY}
weather.api.baseUrl=https://api.openweathermap.org/data/2.5
weather.api.cacheTtlMinutes=10

# Cache Configuration
spring.cache.cache-names=weatherData
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Logging
logging.level.com.ai.weather=INFO
logging.level.org.springframework.web=INFO

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

